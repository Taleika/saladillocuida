<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Albergue | Saladillo Cuida</title><link rel="stylesheet" href="albergue.css"></head><body><main class="main"><section class="card" style="padding:16px"><h1>Admin albergue</h1><p style="color:#536558">Cargá nuevas fichas del albergue municipal.</p><p><strong>TODO Auth:</strong> proteger esta pantalla con Firebase Authentication y lista de emails autorizados antes de producción.</p>
<form id="f"><label>ID de ficha<input name="idFicha" required></label><label>Nombre<input name="nombre" required></label><label>Raza / apodo divertido<input name="raza" placeholder="Ej: Golden Retrovisor"></label><label>Canil<input name="canil" required></label><label>Sexo<input name="sexo" required></label><label>Edad<input name="edad" required></label><label>Tamaño<input name="tamano" required></label><label>Descripción<textarea name="descripcion" required></textarea></label><label><input type="checkbox" name="castrado"> Castrado</label><label><input type="checkbox" name="vacunado"> Vacunado</label><label><input type="checkbox" name="desparasitado"> Desparasitado</label><label>Estado<select name="estado"><option value="disponible">disponible</option><option value="reservado">reservado</option><option value="adoptado">adoptado</option></select></label><label><input type="checkbox" name="destacado"> Destacado</label><label>Foto<input type="file" id="foto" accept="image/*" required></label><img id="preview" style="max-width:280px;border-radius:12px;display:none"><button class="btn-adopt" id="submitBtn" type="submit">Guardar ficha</button><p id="estadoMsg"></p></form></section></main><script type="module" src="admin-albergue.js"></script></body></html>
