<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Saladillo Cuida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">
<link rel="manifest" href="/saladillocuida/manifest.json">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  background: #4CAF50;
  padding: 10px;
  text-align: center;
}

header img {
  max-width: 100%;
}

.container {
  padding: 15px;
}
 
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input, select, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

textarea {
  resize: none;
}

button {
  background: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
}

.preview img, .post img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

.post {
  border-bottom: 1px solid #eee;
  padding: 10px 0;
}

.admin-btn {
  background: #f44336;
  margin-top: 8px;
}

.whatsapp-btn {
  background: #25D366;
  margin-top: 8px;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #4CAF50;
  color: white;
  padding: 15px 20px;
  border-radius: 25px;
  display: none;
}
</style>
</head>

<body>

<header>
  <img src="logosc.png" alt="Saladillo Cuida">
</header>

<div style="text-align:center; padding:10px;">
  <button id="installBtnTop" style="display:none">
    📲 Instalar Saladillo Cuida
  </button>
</div>

<div class="container">

<div class="card">
  <button id="installBtn" style="display:none">📲 Instalar Saladillo Cuida</button>
</div>

<div class="card">
<h2>📍 Publicar mascota</h2>

<label>Tipo</label>
<select id="tipo">
  <option>Perro</option>
  <option>Gato</option>
</select>

<label>Estado</label>
<select id="estado">
  <option>Perdido</option>
  <option>Encontrado</option>
</select>

<label>Foto</label>
<button onclick="camara.click()">📸 Sacar foto</button>
<button onclick="galeria.click()">🖼️ Adjuntar foto</button>

<input type="file" id="camara" accept="image/*" capture="environment" hidden>
<input type="file" id="galeria" accept="image/*" hidden>

<div class="preview">
  <img id="previewImg">
</div>

<label>Ubicación</label>
<button onclick="usarUbicacion()">📍 Usar ubicación actual</button>
<input type="text" id="ubicacion" placeholder="Calle y altura">

<label>Teléfono</label>
<input type="tel" id="telefono">

<label>Comentario</label>
<textarea id="comentario" rows="3" placeholder="Ej: Se escapó anoche, es manso..."></textarea>

<button onclick="publicar()">Publicar aviso</button>
</div>

<div class="card">
<h2>🐾 Avisos recientes</h2>
<div id="feed">Cargando avisos...</div>
</div>

</div>

<div class="toast" id="toast">✅ Aviso publicado</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  updateDoc, deleteDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8F48ib5OUrQZDThyUYPKBYQpNMO4d23Y",
  authDomain: "saladillo-cuida.firebaseapp.com",
  projectId: "saladillo-cuida",
  storageBucket: "saladillo-cuida.firebasestorage.app",
  messagingSenderId: "728549842822",
  appId: "1:728549842822:web:e4fdf5e08d915e9461d607"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const ADMIN_KEY = "saladillo2026";
const isAdmin = new URLSearchParams(location.search).get("admin") === ADMIN_KEY;

let archivoFoto = null;

camara.onchange = galeria.onchange = e => {
  archivoFoto = e.target.files[0];
  previewImg.src = URL.createObjectURL(archivoFoto);
};

window.usarUbicacion = () => {
  navigator.geolocation.getCurrentPosition(async p => {
    const lat = p.coords.latitude;
    const lng = p.coords.longitude;
    ubicacion.value = `https://www.google.com/maps?q=${lat},${lng}`;
  });
};

window.publicar = async () => {
  let fotoURL = "";

  if (archivoFoto) {
    const r = ref(storage, "animals/" + Date.now());
    await uploadBytes(r, archivoFoto);
    fotoURL = await getDownloadURL(r);
  }

  await addDoc(collection(db, "avisos"), {
    tipo: tipo.value,
    estado: estado.value,
    ubicacion: ubicacion.value,
    telefono: telefono.value,
    comentario: comentario.value,
    foto: fotoURL,
    activo: true,
    fecha: serverTimestamp()
  });

  toast.innerText = "✅ Aviso publicado con éxito!";
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);

  cargarAvisos();
};

async function cargarAvisos() {
  const snap = await getDocs(collection(db, "avisos"));

  const avisos = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .filter(a => a.activo)
    .sort((a, b) => b.fecha?.toMillis() - a.fecha?.toMillis());

  feed.innerHTML = avisos.length === 0 ? "Todavía no hay avisos." : "";

  avisos.forEach(a => {
    const fecha = a.fecha?.toDate ? a.fecha.toDate() : new Date();
    const fechaStr = fecha.toLocaleString("es-AR", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });

    feed.innerHTML += `
      <div class="post">
        <strong>${a.tipo} · ${a.estado}</strong> · <small>${fechaStr}</small><br>
        <small>
          ${a.ubicacion ? `<a href="${a.ubicacion}" target="_blank">📍 Ver en mapa</a>` : ""}
        </small>
        ${a.foto ? `<img src="${a.foto}">` : ""}
        ${a.comentario ? `<p>📝 ${a.comentario}</p>` : ""}
        <p>📞 ${a.telefono || ""}</p>
        <button class="whatsapp-btn" onclick="window.open('https://wa.me/${a.telefono}')">WhatsApp</button>
        ${isAdmin ? `
          <button class="admin-btn" onclick="ocultar('${a.id}')">👁️ Ocultar</button>
          <button class="admin-btn" onclick="eliminar('${a.id}')">🗑️ Eliminar</button>
        ` : ""}
      </div>
    `;
  });
}

window.ocultar = async id => {
  await updateDoc(doc(db, "avisos", id), { activo: false });
  cargarAvisos();
};

window.eliminar = async id => {
  if (confirm("¿Eliminar definitivamente este aviso? Esta acción no se puede deshacer.")) {
    await deleteDoc(doc(db, "avisos", id));
    cargarAvisos();
  }
};

cargarAvisos();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/saladillocuida/service-worker.js")
    .then(() => console.log("SW registrado"))
    .catch(err => console.log("Error SW:", err));
}

let deferredPrompt;
const installBtn = document.getElementById("installBtnTop");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.onclick = async () => {
  installBtn.style.display = "none";
  await deferredPrompt.prompt();
  deferredPrompt = null;
};
</script>

</body>
</html>
