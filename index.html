<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Saladillo Cuida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
}

header {
  background: #4CAF50;
  padding: 10px;
  text-align: center;
}

header img {
  max-width: 100%;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
}

.preview img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

.post {
  border-bottom: 1px solid #eee;
  padding: 10px 0;
}

.post img {
  width: 100%;
  border-radius: 10px;
  margin-top: 8px;
}

.post small {
  color: #777;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #4CAF50;
  color: white;
  padding: 15px 20px;
  border-radius: 25px;
  display: none;
}
</style>
</head>

<body>

<header>
  <img src="logosc.png" alt="Saladillo Cuida">
</header>

<div class="container">

  <!-- INSTALAR -->
  <div class="card">
    <button id="installBtn" style="display:none">📲 Instalar Saladillo Cuida</button>
  </div>

  <!-- FORM -->
  <div class="card">
    <h2>📍 Publicar mascota</h2>

    <label>Tipo</label>
    <select id="tipo">
      <option>Perro</option>
      <option>Gato</option>
    </select>

    <label>Estado</label>
    <select id="estado">
      <option>Perdido</option>
      <option>Encontrado</option>
    </select>

    <label>Foto</label>
    <button onclick="abrirCamara()">📸 Sacar foto</button>
    <button onclick="abrirGaleria()">🖼️ Adjuntar foto</button>

    <input type="file" id="camara" accept="image/*" capture="environment" hidden>
    <input type="file" id="galeria" accept="image/*" hidden>

    <div class="preview">
      <img id="previewImg">
    </div>

    <label>Ubicación</label>
    <button onclick="usarUbicacion()">📍 Usar ubicación actual</button>
    <input type="text" id="ubicacion" placeholder="O escribí calle y altura">

    <label>Teléfono</label>
    <input type="tel" id="telefono" placeholder="Ej: 2344 123456">

    <button onclick="publicar()">Publicar aviso</button>
  </div>

  <!-- FEED -->
  <div class="card">
    <h2>🐾 Avisos recientes</h2>
    <div id="feed">Cargando avisos...</div>
  </div>

</div>

<div class="toast" id="toast">✅ Aviso publicado</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8F48ib5OUrQZDThyUYPKBYQpNMO4d23Y",
  authDomain: "saladillo-cuida.firebaseapp.com",
  projectId: "saladillo-cuida",
  storageBucket: "saladillo-cuida.firebasestorage.app",
  messagingSenderId: "728549842822",
  appId: "1:728549842822:web:e4fdf5e08d915e9461d607"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let archivoFoto = null;

window.abrirCamara = () => camara.click();
window.abrirGaleria = () => galeria.click();

camara.onchange = galeria.onchange = e => {
  archivoFoto = e.target.files[0];
  previewImg.src = URL.createObjectURL(archivoFoto);
};

window.usarUbicacion = () => {
  navigator.geolocation.getCurrentPosition(pos => {
    ubicacion.value = `Lat ${pos.coords.latitude}, Lng ${pos.coords.longitude}`;
  });
};

window.publicar = async () => {
  let fotoURL = "";

  if (archivoFoto) {
    const refFoto = ref(storage, "fotos/" + Date.now());
    await uploadBytes(refFoto, archivoFoto);
    fotoURL = await getDownloadURL(refFoto);
  }

  await addDoc(collection(db, "avisos"), {
    tipo: tipo.value,
    estado: estado.value,
    ubicacion: ubicacion.value,
    telefono: telefono.value,
    foto: fotoURL,
    fecha: new Date()
  });

  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 2500);

  // 🔗 MENSAJE WHATSAPP
  const mensaje = `
🐾 ${tipo.value.toUpperCase()} ${estado.value.toUpperCase()} en Saladillo

📍 Ubicación: ${ubicacion.value || "No especificada"}
📞 Contacto: ${telefono.value}

🔎 Ayudanos a difundir
Saladillo Cuida
  `;

  const urlWA = "https://wa.me/?text=" + encodeURIComponent(mensaje);
  window.open(urlWA, "_blank");

  cargarAvisos();
};
async function cargarAvisos() {
  const q = query(collection(db, "avisos"), orderBy("fecha", "desc"));
  const snap = await getDocs(q);
  feed.innerHTML = "";

  snap.forEach(doc => {
    const d = doc.data();
    feed.innerHTML += `
      <div class="post">
        <strong>${d.tipo} · ${d.estado}</strong><br>
        <small>${d.ubicacion}</small>
        ${d.foto ? `<img src="${d.foto}">` : ""}
        <p>📞 ${d.telefono}</p>
      </div>
    `;
  });

  if (snap.empty) feed.innerHTML = "Todavía no hay avisos.";
}

cargarAvisos();

// PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.onclick = () => deferredPrompt.prompt();
</script>

</body>
</html>
