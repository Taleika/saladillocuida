<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Saladillo Cuida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<style>
body { margin:0; font-family:Arial; background:#f5f5f5; }
header { background:#4CAF50; padding:10px; text-align:center; }
header img { max-width:100%; }
.container { padding:15px; }
.card { background:white; padding:15px; border-radius:12px; margin-bottom:15px; box-shadow:0 2px 6px rgba(0,0,0,.1);}
label{ display:block; margin-top:10px; font-weight:bold;}
input,select,textarea,button{ width:100%; padding:10px; margin-top:5px; border-radius:8px; border:1px solid #ccc;}
button{ background:#4CAF50; color:white; border:none; cursor:pointer;}
.post img{ width:100%; border-radius:10px; margin-top:10px;}
.admin-btn{ background:#f44336; margin-top:8px;}
.whatsapp-btn{ background:#25D366; margin-top:8px;}
.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#4CAF50; color:white; padding:15px 20px; border-radius:25px; display:none;}
#mapaCalor div{ font-size:13px;}
</style>
</head>

<body>

<header>
<img src="logosc.png" alt="Saladillo Cuida">
</header>

<div class="container">

<div class="card">
<h2>📍 Publicar mascota</h2>

<label>Tipo</label>
<select id="tipo">
<option>Perro</option>
<option>Gato</option>
</select>

<label>Estado</label>
<select id="estado">
<option>Perdido</option>
<option>Encontrado</option>
<option>En adopción</option>
</select>

<label>Ubicación</label>
<button onclick="usarUbicacion()">📍 Usar ubicación actual</button>
<input type="text" id="ubicacion">

<label>Teléfono</label>
<input type="tel" id="telefono">

<label>Comentario</label>
<textarea id="comentario"></textarea>

<button onclick="publicar()">Publicar aviso</button>
</div>

<div class="card">
<h2>🐾 Avisos recientes</h2>
<div id="feed">Cargando avisos...</div>
</div>

<div class="card">
<h2>📊 Reportar animal en situación de calle</h2>

<p id="contadorReportes">Cargando estadísticas...</p>
<p id="desgloseTipos"></p>
<p id="desgloseZonas"></p>
<div id="mapaCalor"></div>

<label>Tipo</label>
<select id="tipoReporte">
<option>Perro</option>
<option>Gato</option>
</select>

<label>Zona / Barrio</label>
<input type="text" id="zonaReporte">

<button onclick="usarUbicacionReporte()">📍 Usar ubicación exacta</button>

<label>Comentario</label>
<textarea id="comentarioReporte"></textarea>

<button onclick="enviarReporte()">Enviar reporte</button>

</div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "saladillo-cuida.firebaseapp.com",
projectId: "saladillo-cuida",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let latReporte = null;
let lngReporte = null;

function mostrarToast(t){
toast.innerText=t;
toast.style.display="block";
setTimeout(()=>toast.style.display="none",3000);
}

window.usarUbicacionReporte=()=>{
navigator.geolocation.getCurrentPosition(p=>{
latReporte=p.coords.latitude;
lngReporte=p.coords.longitude;
mostrarToast("Ubicación capturada");
});
};

window.publicar=async()=>{
await addDoc(collection(db,"avisos"),{
tipo:tipo.value,
estado:estado.value,
ubicacion:ubicacion.value,
telefono:telefono.value,
comentario:comentario.value,
fecha:serverTimestamp()
});
mostrarToast("Aviso publicado");
};

window.enviarReporte=async()=>{

if(!latReporte||!lngReporte){
mostrarToast("Usá ubicación exacta para el reporte");
return;
}

const snap=await getDocs(collection(db,"reportes"));
const ahora=Date.now();

const duplicado=snap.docs.some(d=>{
const r=d.data();
if(!r.fecha) return false;
const fecha=r.fecha.toDate().getTime();
return (ahora-fecha<86400000 &&
r.tipo===tipoReporte.value &&
r.zona===zonaReporte.value);
});

if(duplicado){
mostrarToast("Ya existe un reporte reciente en esa zona");
return;
}

await addDoc(collection(db,"reportes"),{
tipo:tipoReporte.value,
zona:zonaReporte.value,
comentario:comentarioReporte.value,
lat:latReporte,
lng:lngReporte,
fecha:serverTimestamp()
});

mostrarToast("Reporte enviado");
zonaReporte.value="";
comentarioReporte.value="";
latReporte=null;
lngReporte=null;

cargarEstadisticas();
};

async function cargarEstadisticas(){
const snap=await getDocs(collection(db,"reportes"));
const reportes=snap.docs.map(d=>d.data());

let perros=0,gatos=0,zonas={};

reportes.forEach(r=>{
if(r.tipo==="Perro")perros++;
if(r.tipo==="Gato")gatos++;
if(r.zona)zonas[r.zona]=(zonas[r.zona]||0)+1;
});

contadorReportes.innerText=`📈 ${reportes.length} reportes registrados`;
desgloseTipos.innerText=`🐶 ${perros} | 🐱 ${gatos}`;

const top=Object.entries(zonas).sort((a,b)=>b[1]-a[1]);
desgloseZonas.innerText="Zonas críticas: "+top.slice(0,5).map(z=>`${z[0]}(${z[1]})`).join(" | ");

generarMapaCalor(zonas);
}

function generarMapaCalor(zonas){
mapaCalor.innerHTML="";
const max=Math.max(...Object.values(zonas),1);
Object.entries(zonas).forEach(([z,c])=>{
const intensidad=c/max;
const rojo=Math.floor(255*intensidad);
const div=document.createElement("div");
div.style.background=`rgb(${rojo},50,50)`;
div.style.color="white";
div.style.padding="5px";
div.style.marginBottom="3px";
div.style.borderRadius="5px";
div.innerText=`${z} — ${c}`;
mapaCalor.appendChild(div);
});
}

cargarEstadisticas();


// 🔥 REGISTRO PROFESIONAL SERVICE WORKER

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/saladillocuida/service-worker.js")
    .then(registration => {

      registration.onupdatefound = () => {
        const newWorker = registration.installing;

        newWorker.onstatechange = () => {
          if (newWorker.state === "installed") {
            if (navigator.serviceWorker.controller) {
              alert("Nueva versión disponible. La app se actualizará automáticamente.");
              window.location.reload();
            }
          }
        };
      };

    })
    .catch(error => {
      console.log("Error registrando Service Worker:", error);
    });
}

</script>

</body>
</html>
