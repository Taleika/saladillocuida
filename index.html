<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Saladillo Cuida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
}

header {
  background: #4CAF50;
  padding: 10px;
  text-align: center;
}

header img {
  max-width: 100%;
  height: auto;
}

.container {
  padding: 15px;
}

h2 {
  margin-top: 0;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #4CAF50;
  color: white;
  border: none;
  margin-top: 15px;
}

button:active {
  transform: scale(0.98);
}

.filters {
  display: flex;
  gap: 10px;
}

.filters select {
  flex: 1;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #4CAF50;
  color: white;
  padding: 15px 20px;
  border-radius: 25px;
  display: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<header>
  <img src="logosc.png" alt="Saladillo Cuida">
</header>

<div class="container">

  <!-- FILTROS -->
  <div class="card">
    <h2>🔎 Filtrar avisos</h2>
    <div class="filters">
      <select id="filtroTipo">
        <option value="">Perros y gatos</option>
        <option value="Perro">🐶 Perros</option>
        <option value="Gato">🐱 Gatos</option>
      </select>

      <select id="filtroEstado">
        <option value="">Perdidos y encontrados</option>
        <option value="Perdido">🔴 Perdidos</option>
        <option value="Encontrado">🟢 Encontrados</option>
      </select>
    </div>
  </div>

  <!-- FORMULARIO -->
  <div class="card">
    <h2>📍 Publicar mascota</h2>

    <label>Tipo</label>
    <select id="tipo">
      <option>Perro</option>
      <option>Gato</option>
    </select>

    <label>Estado</label>
    <select id="estado">
      <option>Perdido</option>
      <option>Encontrado</option>
    </select>

    <label>Foto</label>
    <input type="file" accept="image/*" capture="environment">

    <label>Ubicación (Google Maps)</label>
    <input type="text" id="ubicacion" placeholder="Pegá el link o escribí la dirección">

    <label>Teléfono de contacto</label>
    <input type="tel" placeholder="Ej: 2344 123456">

    <button onclick="publicar()">Publicar aviso</button>
  </div>

</div>

<div class="toast" id="toast">
  ✅ Aviso publicado correctamente
</div>

<script>
// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

// Confirmación visual
function publicar() {
  const toast = document.getElementById("toast");
  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  }, 3000);
}
</script>

</body>
</html>
