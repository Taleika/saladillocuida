<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Saladillo Cuida</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
}

header {
  background: #4CAF50;
  padding: 10px;
  text-align: center;
}

header img {
  max-width: 100%;
  height: auto;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #4CAF50;
  color: white;
  border: none;
  margin-top: 10px;
}

.preview {
  margin-top: 10px;
  text-align: center;
}

.preview img {
  max-width: 100%;
  border-radius: 10px;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #4CAF50;
  color: white;
  padding: 15px 20px;
  border-radius: 25px;
  display: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<header>
  <img src="logosc.png" alt="Saladillo Cuida">
</header>

<div class="container">

  <!-- BOTÓN INSTALAR -->
  <div class="card">
    <button id="installBtn" style="display:none">📲 Instalar Saladillo Cuida</button>
  </div>

  <!-- FORMULARIO -->
  <div class="card">
    <h2>📍 Publicar mascota</h2>

    <label>Tipo</label>
    <select id="tipo">
      <option value="Perro">Perro</option>
      <option value="Gato">Gato</option>
    </select>

    <label>Estado</label>
    <select id="estado">
      <option value="Perdido">Perdido</option>
      <option value="Encontrado">Encontrado</option>
    </select>

    <label>Foto</label>
    <button onclick="abrirCamara()">📸 Sacar foto ahora</button>
    <button onclick="abrirGaleria()">🖼️ Adjuntar foto</button>

    <input type="file" id="camara" accept="image/*" capture="environment" hidden>
    <input type="file" id="galeria" accept="image/*" hidden>

    <div class="preview">
      <img id="previewImg">
    </div>

    <label>Ubicación</label>
    <button onclick="usarUbicacion()">📍 Usar mi ubicación actual</button>

    <input type="text" id="direccion" placeholder="O escribí calle y altura">

    <label>Teléfono</label>
    <input type="tel" id="telefono" placeholder="Ej: 2344 123456">

    <button onclick="publicar()">Publicar aviso</button>
  </div>

</div>

<div class="toast" id="toast">
  ✅ Aviso publicado correctamente
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getStorage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8F48ib5OUrQZDThyUYPKBYQpNMO4d23Y",
    authDomain: "saladillo-cuida.firebaseapp.com",
    projectId: "saladillo-cuida",
    storageBucket: "saladillo-cuida.firebasestorage.app",
    messagingSenderId: "728549842822",
    appId: "1:728549842822:web:e4fdf5e08d915e9461d607"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window.db = db;
  window.storage = storage;
</script>

<script>
// SERVICE WORKER
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

// INSTALAR PWA
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", () => {
  deferredPrompt.prompt();
});

// FOTO
const previewImg = document.getElementById("previewImg");
let archivoFoto = null;

function abrirCamara() {
  document.getElementById("camara").click();
}

function abrirGaleria() {
  document.getElementById("galeria").click();
}

document.getElementById("camara").onchange = mostrarFoto;
document.getElementById("galeria").onchange = mostrarFoto;

function mostrarFoto(e) {
  archivoFoto = e.target.files[0];
  if (!archivoFoto) return;

  const reader = new FileReader();
  reader.onload = () => previewImg.src = reader.result;
  reader.readAsDataURL(archivoFoto);
}

// UBICACIÓN
function usarUbicacion() {
  if (!navigator.geolocation) {
    alert("La ubicación no está disponible");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById("direccion").value =
      `Lat ${pos.coords.latitude.toFixed(5)}, Lng ${pos.coords.longitude.toFixed(5)}`;
  });
}

// PUBLICAR (por ahora visual)
function publicar() {
  const toast = document.getElementById("toast");
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);
}
</script>

</body>
</html>
