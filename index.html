<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Saladillo Cuida</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">
<link rel="manifest" href="/saladillocuida/manifest.json">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  background: #4CAF50;
  padding: 10px;
  text-align: center;
}

header img {
  max-width: 100%;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input, select, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

textarea {
  resize: none;
}

button {
  background: #4CAF50;
  color: white;
  border: none;
  cursor: pointer;
}

.preview img, .post img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

.post {
  border-bottom: 1px solid #eee;
  padding: 10px 0;
}

.admin-btn {
  background: #f44336;
  margin-top: 8px;
}

.whatsapp-btn {
  background: #25D366;
  margin-top: 8px;
}

.reporte-btn {
  background: #ff9800;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #4CAF50;
  color: white;
  padding: 15px 20px;
  border-radius: 25px;
  display: none;
}
</style>
</head>

<body>

<header>
  <img src="logosc.png" alt="Saladillo Cuida">
</header>

<div class="container">

<!-- BOTÓN REPORTE -->
<div class="card">
  <button class="reporte-btn" onclick="toggleReporte()">
    🐕 Reportar animal en la vía pública
  </button>

  <div id="formReporte" style="display:none; margin-top:10px;">
    <label>Foto (opcional)</label>
    <input type="file" id="fotoReporte" accept="image/*">

    <label>Ubicación</label>
    <button onclick="usarUbicacionReporte()">📍 Usar ubicación actual</button>
    <input type="text" id="ubicacionReporte" placeholder="Calle y altura">

    <button onclick="enviarReporte()">Enviar reporte</button>
  </div>
</div>

<!-- FORMULARIO ORIGINAL -->
<div class="card">
<h2>📍 Publicar mascota</h2>

<p style="background:#e8f5e9; padding:10px; border-radius:8px; font-size:14px;">
📌 Promovemos la adopción responsable, priorizando el bienestar y el compromiso hacia cada animal.
</p>

<label>Tipo</label>
<select id="tipo">
  <option>Perro</option>
  <option>Gato</option>
</select>

<label>Estado</label>
<select id="estado">
  <option>Perdido</option>
  <option>Encontrado</option>
  <option>En adopción</option>
</select>

<label>Foto</label>
<input type="file" id="camara" accept="image/*" capture="environment">

<div class="preview">
  <img id="previewImg">
</div>

<label>Ubicación</label>
<button onclick="usarUbicacion()">📍 Usar ubicación actual</button>
<input type="text" id="ubicacion" placeholder="Calle y altura">

<label>Teléfono</label>
<input type="tel" id="telefono">

<label>Comentario</label>
<textarea id="comentario" rows="3"></textarea>

<button onclick="publicar()">Publicar aviso</button>
</div>

<div class="card">
<h2>🐾 Avisos recientes</h2>
<div id="feed">Cargando avisos...</div>
</div>

<!-- NUEVA SECCIÓN REPORTES -->
<div class="card">
<h2>🚨 Reportes de animales en la vía pública</h2>
<div id="feedReportes">Cargando reportes...</div>
</div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  updateDoc, deleteDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "saladillo-cuida.firebaseapp.com",
  projectId: "saladillo-cuida",
  storageBucket: "saladillo-cuida.firebasestorage.app",
  messagingSenderId: "728549842822",
  appId: "1:728549842822:web:e4fdf5e08d915e9461d607"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let archivoFoto = null;
camara.onchange = e => {
  archivoFoto = e.target.files[0];
  previewImg.src = URL.createObjectURL(archivoFoto);
};

window.usarUbicacion = () => {
  navigator.geolocation.getCurrentPosition(p => {
    ubicacion.value = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
  });
};

window.publicar = async () => {
  let fotoURL = "";
  if (archivoFoto) {
    const r = ref(storage, "animals/" + Date.now());
    await uploadBytes(r, archivoFoto);
    fotoURL = await getDownloadURL(r);
  }

  await addDoc(collection(db, "avisos"), {
    tipo: tipo.value,
    estado: estado.value,
    ubicacion: ubicacion.value,
    telefono: telefono.value,
    comentario: comentario.value,
    foto: fotoURL,
    activo: true,
    fecha: serverTimestamp()
  });

  toast.innerText = "✅ Aviso publicado";
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);

  cargarAvisos();
};

async function cargarAvisos() {
  const snap = await getDocs(collection(db, "avisos"));
  const avisos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  feed.innerHTML = "";

  avisos.forEach(a => {
    if (!a.activo) return;

    const fecha = a.fecha?.toDate ? a.fecha.toDate() : new Date();
    const fechaStr = fecha.toLocaleString("es-AR");

    feed.innerHTML += `
      <div class="post">
        <strong>${a.tipo} · ${a.estado}</strong> · <small>${fechaStr}</small><br>
        ${a.ubicacion ? `<a href="${a.ubicacion}" target="_blank">📍 Ver ubicación</a>` : ""}
        ${a.foto ? `<img src="${a.foto}">` : ""}
        ${a.comentario ? `<p>${a.comentario}</p>` : ""}
        ${a.telefono ? `<p>📞 ${a.telefono}</p>` : ""}
      </div>
    `;
  });
}

window.toggleReporte = () => {
  formReporte.style.display = formReporte.style.display === "none" ? "block" : "none";
};

window.usarUbicacionReporte = () => {
  navigator.geolocation.getCurrentPosition(p => {
    ubicacionReporte.value = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
  });
};

window.enviarReporte = async () => {
  let fotoURL = "";
  const archivo = fotoReporte.files[0];

  if (archivo) {
    const r = ref(storage, "reportes/" + Date.now());
    await uploadBytes(r, archivo);
    fotoURL = await getDownloadURL(r);
  }

  await addDoc(collection(db, "reportes"), {
    foto: fotoURL,
    ubicacion: ubicacionReporte.value,
    fecha: serverTimestamp()
  });

  toast.innerText = "🚨 Reporte enviado";
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);

  cargarReportes();
  formReporte.style.display = "none";
};

async function cargarReportes() {
  const snap = await getDocs(collection(db, "reportes"));
  const reportes = snap.docs.map(d => d.data());

  feedReportes.innerHTML = "";

  reportes.forEach(r => {
    const fecha = r.fecha?.toDate ? r.fecha.toDate() : new Date();
    const fechaStr = fecha.toLocaleString("es-AR");

    feedReportes.innerHTML += `
      <div class="post">
        <small>${fechaStr}</small><br>
        ${r.ubicacion ? `<a href="${r.ubicacion}" target="_blank">📍 Ver ubicación</a>` : ""}
        ${r.foto ? `<img src="${r.foto}">` : ""}
      </div>
    `;
  });
}

cargarAvisos();
cargarReportes();

</script>

</body>
</html>
