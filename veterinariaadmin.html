<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar guía veterinaria | Saladillo Cuida</title><link rel="stylesheet" href="veterinarias.css"></head><body>
<header class="header"><div class="header-inner"><div class="brand"><img src="logosc.png" alt="Saladillo Cuida"><a class="back" href="veterinarias.html">Ver guía →</a></div><h1>Administrar guía veterinaria</h1><p class="subtitle">Crear, corregir, ocultar y verificar contactos.</p></div></header>
<main class="main admin-shell"><section class="panel"><h2 id="formTitle">Nueva ficha</h2><form id="form" class="form-grid">
<input type="hidden" name="documentId"><label>Nombre<input name="nombre" required></label><label>Dirección<input name="direccion"></label><label>Teléfono principal<input name="telefonoPrincipal" inputmode="tel"></label><label>Teléfono secundario<input name="telefonoSecundario" inputmode="tel"></label><label>WhatsApp principal<input name="whatsappPrincipal" inputmode="tel" placeholder="5492345…"></label><label>WhatsApp secundario<input name="whatsappSecundario" inputmode="tel"></label><label>Horarios<textarea name="horarios" rows="3"></textarea></label><label>Tipo de atención<textarea name="tipoAtencion" rows="3" placeholder="pequeños animales, petshop…"></textarea></label><label>Contacto de urgencias<input name="contactoUrgenciasNombre"></label><label>Teléfono de urgencias<input name="telefonoUrgencias" inputmode="tel"></label><label>WhatsApp de urgencias<input name="whatsappUrgencias" inputmode="tel"></label><label>Estado<select name="estado"><option value="verificado">Verificado</option><option value="a_confirmar">A confirmar</option><option value="incompleto">Incompleto</option></select></label><label>Orden<input name="orden" type="number" min="0" value="999"></label><label class="wide">Observaciones<textarea name="observaciones" rows="3"></textarea></label><div class="check-row wide"><label><input type="checkbox" name="urgencias24hs"> Urgencias 24 hs</label><label><input type="checkbox" name="visible" checked> Visible en la guía</label></div><div class="admin-actions wide"><button id="save" type="submit">Guardar ficha</button><button id="cancel" class="secondary" type="button">Cancelar edición</button></div><p id="formMsg" class="status wide" aria-live="polite"></p></form></section>
<section><div class="panel"><h2>Fichas cargadas</h2><input id="adminSearch" type="search" placeholder="Buscar por nombre, teléfono o dirección"><div class="admin-actions"><button id="seed" class="secondary" type="button">Cargar datos iniciales</button></div><p id="listMsg" class="status" aria-live="polite"></p><div id="list"></div></div></section></main><script type="module" src="veterinariaadmin.js"></script></body></html>
